<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --border: #e2e6ea;
        --text: #1f2937;
        --muted: #6b7280;

        --header: #dff5ec;
        --header-text: #14532d;

        --urgent: #dcfce7;
        --urgent-border: #86efac;

        --hold: #fef9c3;
        --hold-border: #fde047;

        --wood: #a16207;
        --wood-bg: #fffaf0;

        --danger: #fee2e2;
        --danger-text: #b91c1c;

        --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
    }

    /* =========================
       HEADER
       ========================= */

    .header-container {
        display: grid;
        grid-template-columns: 200px 1fr auto auto;
        align-items: center;
        gap: 32px;

        margin-bottom: 24px;
        padding: 18px 24px;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;

        box-shadow: var(--shadow);
    }

    .logo-container {
        width: 180px;
        padding: 0;
    }

    .logo-container img {
        display: block;
        width: 100%;
        height: auto;
    }

    .header-container p {
        margin: 0;
        font-size: 19px !important;
        font-weight: 500;
        color: var(--muted);
        white-space: nowrap;
    }

    .header-container span {
        margin-left: 5px;
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
    }

    #clock {
        min-width: 100px;
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    /* =========================
       TABLE
       ========================= */

    .main-container {
        width: 100%;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;

        background: var(--surface);

        border: 1px solid var(--border);
        border-radius: 14px;

        overflow: hidden;
        box-shadow: var(--shadow);
    }

    thead tr {
        background: var(--header);
    }

    thead td {
        padding: 14px 12px;

        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;

        color: var(--header-text);

        border-bottom: 1px solid #c8e8da;
    }

    tbody tr {
        background: white;
        transition: background-color 0.15s ease;
    }

    tbody tr:nth-child(even) {
        background: #fafbfc;
    }

    tbody tr:hover {
        background: #f1f5f9;
    }

    td {
        padding: 13px 12px;

        font-size: 17px;
        font-weight: 500;

        text-align: center;
        vertical-align: middle;

        color: var(--text);

        border-bottom: 1px solid #edf0f2;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    /* =========================
       ORDER STATES
       ========================= */

    .order-urgent {
        background-color: var(--urgent) !important;
        box-shadow: inset 4px 0 0 var(--urgent-border);
    }

    .order-on-hold {
        background-color: var(--hold) !important;
        box-shadow: inset 4px 0 0 var(--hold-border);
    }

    .order-urgent:hover {
        background-color: #bbf7d0 !important;
    }

    .order-on-hold:hover {
        background-color: #fef08a !important;
    }

    /* Wood orders */

    .wood-order {
        background-color: var(--wood-bg) !important;
        box-shadow: inset 4px 0 0 var(--wood);
    }

    .wood-order:hover {
        background-color: #fff7e6 !important;
    }

    /* =========================
       OPERATION STATUS
       ========================= */

    .op-running,
    .op-paused {
        display: inline-block;

        width: 17px;
        height: 17px;

        border-radius: 50%;

        vertical-align: middle;
    }

    .op-running {
        background: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    .op-paused {
        background: #f97316;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    td i[data-lucide],
    td svg {
        width: 20px;
        height: 20px;
        vertical-align: middle;
    }

    /* =========================
       STATUS COLORS
       ========================= */

    .status-active {
        /* Keep normal appearance */
    }

    .status-done {
        background-color: #ecfdf5;
    }

    .status-problematic {
        background-color: var(--danger);
        color: var(--danger-text);
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1200px) {
        body {
            padding: 16px;
        }

        .header-container {
            grid-template-columns: 160px 1fr auto;
            gap: 20px;
        }

        .logo-container {
            width: 150px;
        }

        #clock {
            grid-column: 3;
        }

        td {
            font-size: 15px;
            padding: 10px 8px;
        }
    }

    @media (max-width: 900px) {
        .header-container {
            grid-template-columns: 1fr 1fr;
        }

        .logo-container {
            width: 160px;
        }

        #clock {
            grid-column: auto;
            text-align: left;
        }

        .header-container p {
            font-size: 16px !important;
        }

        .header-container span {
            font-size: 20px;
        }

        table {
            font-size: 14px;
        }

        td {
            font-size: 14px;
            padding: 9px 6px;
        }
    }
</style>


<body>

    <div class="header-container">
        <div class="logo-container">
            <img src="keralogo.png" />
        </div>
        <div>
            <p style="font-size: 30px;">J&auml;rjekord n&auml;dalates: <span id="queue-in-weeks">0</span></p>
        </div>
        <div>
            <p style="font-size: 30px;">Luuke kokku: <span id="total-hatches-amount">0</span></p>
        </div>
        <div>
            <p id="clock" style="font-size: 30px;"></p>
        </div>
    </div>

    <div class="main-container">

        <table id="main-table">
            <thead>
                <tr>
                    <td>Nr.</td>
                    <td>Mat.</td>
                    <td>SO</td>
                    <td>Objekt</td>
                    <td>T&ouml;&ouml;k&auml;sk</td>
                    <td>Tk</td>
                    <td>L</td>
                    <td>N</td>
                    <td>P</td>
                    <td>K</td>
                    <td>Puudused</td>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="init.js"></script>

</body>

<script type="module">
    import { getOrders, isFinishedOrder } from "./data-helper.js";

    // Declared before the first call: two counts can overlap and a slow
    // older answer must not repaint over a newer one.
    let countSeq = 0;

    calculateData().catch(err => console.error("queue counter failed", err));
    setInterval(calculateData, 10000);

    updateClock();

    setInterval(updateClock, 1000);

    async function calculateData() {

        const seq = ++countSeq;

        let orders = await getOrders();
        if (seq !== countSeq) return;

        let totalAmount = 0;
        for (let order of orders) {

            if (order.getStatus() != null) {
                if (order.getStatus().toLowerCase() == "x") {
                    continue;
                }
            }

            // Same finished test the tables use, so the queue cannot count
            // work the board has already taken off.
            if (!isFinishedOrder(order))
                totalAmount += order.getAmount();
        }

        let queueInWeeks = totalAmount / 55;

        document.getElementById("queue-in-weeks").innerText = queueInWeeks.toFixed(1);
        document.getElementById("total-hatches-amount").innerText = totalAmount;
    }

    function updateClock() {
        const now = new Date();

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");

        document.getElementById("clock").textContent =
            `${hours}:${minutes}:${seconds}`;
    }
</script>

</html>
